[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-kuma-agent"
version = "2.1.0"
description = "Agent for interacting with Uptime Kuma API"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
# NOTE (EH-484 policy update, see /var/tmp/l9/finish/au-decon-G4e/SDK-GAPS.md gap #0):
# agent-utilities is kept for kg_ingest.py's native_ingest import only -- the SDK's
# EG-client ingest facade does not exist yet, and native_ingest must keep working
# (no fail-closed stub). Drop agent-utilities once gap #0 lands.
dependencies = [ "agent-connector-sdk>=0.1.0,<1.0.0", "agent-utilities>=2.0.0,<3.0.0", "uptime-kuma-api>=1.2.1", "requests>=2.34.2",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
uptime-mcp = "uptime_kuma_agent.mcp_server:mcp_server"

[project.entry-points."agent_utilities.skill_providers"]
uptime-kuma-agent = "uptime_kuma_agent.skills"

[project.entry-points."agent_utilities.ontology_providers"]
uptime-kuma-agent = "uptime_kuma_agent.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
uptime-kuma-agent = "uptime_kuma_agent.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
uptime-kuma-agent = "uptime_kuma_agent.prompts"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.uv.sources]
agent-connector-sdk = { path = ".uv-workspace-siblings/agent-connector-sdk", editable = true }
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
uptime_kuma_agent = [ "mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]
