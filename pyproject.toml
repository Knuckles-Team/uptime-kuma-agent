[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-kuma-agent"
version = "2.3.6"
description = "Agent for interacting with Uptime Kuma API"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.6.3,<0.7.0", "uptime-kuma-api>=1.2.1", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "scion-sdk[mcp]>=0.6.3,<0.7.0",]
all = [ "scion-sdk[mcp]>=0.6.3,<0.7.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
uptime-mcp = "uptime_kuma_agent.mcp_server:mcp_server"

[project.entry-points."scion_sdk.prompt_providers"]
uptime-kuma-agent = "uptime_kuma_agent.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
uptime-kuma = "uptime_kuma_agent:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
uptime_kuma_agent = [ "mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.pipelines]
# uptime-kuma-api publishes only a source distribution; the release readiness
# gate and the Dockerfile build it from source, and nothing else.
allow-source-build = ["uptime-kuma-api"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
